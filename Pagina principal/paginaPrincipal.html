<!DOCTYPE HTML>
<html lang="pt-br">
    
    <head>

        <meta charset="utf-8">
        <title>Vipstyle Fitness</title>
        <link rel="stylesheet" href="css/style.css">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }


            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
            }

            .conteudo-principal {
                margin-left: 220px;
            }

            .top-bar {
            background-color: #333; /* Uma cor de fundo escura */
            padding: 8px 30px;
            }

            .top-bar ul {
                list-style: none;
                display: flex;
                justify-content: flex-end; /* Alinha as opções à DIREITA */
            }

            .top-bar li {
                margin-left: 20px;
            }

            .top-bar a {
                color: white;
                text-decoration: none;
                font-size: 14px;
            }
        
            .top-bar a:hover {
                text-decoration: underline;
            }

            /*logo*/
            .logo-container {
            text-align: center; 
            padding: 30px 0; 
            background-color: #d033d1;
            }

            .logo-principal img {
                max-width: 250px;
                height: auto;
            }
            /*fim logo*/

            /*Barra de navegação*/
            .nav-links {
                list-style: none; /* Remove as bolinhas da lista */
                display: flex; /* Alinha os itens da lista lado a lado */
            }
            .nav-links li {
                margin-left: 20px; /* Espaçamento entre os botões */
            }
            .nav-links a {
                color: white;
                text-decoration: none; /* Remove o sublinhado */
                font-size: 18px;
                padding: 8px 12px;
                border-radius: 5px;
                transition: background-color 0.3s, transform 0.3s; /* Efeito suave na transição */
                font-size: 19px;
            }
            
            .nav-links a:hover {
                background-color: #555;
                font-size: 19.5px;
            }

            /*Fim navbar*/

            /*Menu*/
            .menu-navegacao {
                display: flex; /* Alinha os itens lado a lado */
                justify-content: center; /* Espaça o logo e os links */
                align-items: center; /* Centraliza verticalmente */
                background-color: #d033d1;
                padding: 15px 30px;
                box-shadow: 0 1px 0px rgba(0,0,0,0.2);
            }

            .menu-navegacao .logo {
                color: white;
                font-size: 24px;
                font-weight: bold;
                text-decoration: none;
            }
        
            .menu-vertical {
                background-color: #d033d1; /* Um pouco mais escuro que seu top-bar */
                width: 220px;           /* Largura da barra vertical */
                height: 100vh;          /* 100% da altura da tela */
                position: fixed;        /* Fixo na tela, mesmo com scroll */
                top: 0;
                left: 0;
                z-index: 10;            /* Garante que fique acima de outros itens */
                padding-top: 20px;      /* Um espaço no topo */
            }
            
            .menu-vertical ul {
                list-style-type: none;
            }

            .menu-vertical li a {
                display: block;
                color: white;
                padding: 15px 25px;
                text-decoration: none;
                font-size: 16px;
                transition: background-color 0.3s, font-size 0.3s;
            }

            .menu-vertical li a:hover {
                background-color: #f4f4f4; /* Usa a cor rosa do seu menu horizontal */
                font-size: 18px;
                color: #333;
            }
            /*encerramento menu*/  

        </style>

    </head>
    <body>

        <nav class="menu-vertical">
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Coleções</a></li>
                <li><a href="#">Entrar em contato</a></li>
            </ul>
        </nav>
        <main class="conteudo-principal">

        <!--top bar-->
        <div class="logo-container">
            <a href="paginaPrincipal.html" class="logo-principal">
                <img src="" alt="Logo marca">
            </a>

        </div>

        <!--Menu-->
        <div>

            <header>
                <nav class="menu-navegacao">
                    <ul class="nav-links">
                        <li><a href="paginaPrincipal.html">Início</a></li>
                        <li><a href="#sobre">Sobre</a></li>
                        <li><a href="#servicos">Serviços</a></li>
                        <li><a href="#portfolio">Catálogo</a></li>
                        <li><a href="#contato">Contato</a></li>
                    </ul>
                </nav>
            </header>

        </div>

        <!--menu vertical-->
        <div>



        </div>

        <!--Banner principal-->

        <!--Destaque-->

        </main>
    </body>

</html>
