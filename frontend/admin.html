<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Admin - Vipstyle</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <h1>Painel de Gerenciamento de Produtos</h1>

    <form id="form-produto">
        <input type="hidden" id="produto-id"> <div>
            <label>Nome:</label>
            <input type="text" id="nome-produto" required>
        </div>
        <div>
            <label>Preço (ex: 159.90):</label>
            <input type="number" step="0.01" id="preco-produto" required>
        </div>
        <div>
            <label>URL da Imagem (ex: img/produto-x.png):</label>
            <input type="text" id="imagem-produto" required>
        </div>
        <div>
            <label>Categoria (ex: 'destaque' ou 'colecao'):</label>
            <input type="text" id="categoria-produto" required>
        </div>
        <button type="submit">Salvar Produto</button>
    </form>

    <hr>

    <h2>Produtos Cadastrados</h2>
    <div id="lista-produtos">
        </div>

    <script src="js/admin.js"></script>
</body>
</html>
