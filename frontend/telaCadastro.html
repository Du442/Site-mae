<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Vipstyle Fitness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="cabecalho-principal" id="cabecalho-principal">
        <div class="logo-container">
            <a href="paginaPrincipal.html" class="logo-principal"><img src="img/icons-vertical-menu/logo2.png" alt="Logo"></a>
        </div>
        <nav class="menu-navegacao">
            <ul class="nav-links">
                <li>
                    <a href="paginaPrincipal.html" title="Inicio">
                        <img src="img/icons-vertical-menu/logo home.png" alt="Início" class="nav-icon">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-principal" style="margin-top: 0;">
        <div class="conteudo-wrapper">
            
            <div class="cadastro-container">
                <h2>Crie sua conta</h2>
                <p>Preencha seus dados para acompanhar seus pedidos.</p>

                <form id="form-cadastro-cliente">
                    
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="cliente-nome" required placeholder="Seu nome">
                    </div>

                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="cliente-email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label>Telefone / WhatsApp</label>
                        <input type="text" id="cliente-telefone" placeholder="(XX) 9XXXX-XXXX" maxlength="15">
                    </div>
                    
                    <div class="form-group">
                        <label>Endereço Completo</label>
                        <input type="text" id="cliente-endereco" placeholder="Rua, Número, Bairro, Cidade">
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="cliente-senha" required placeholder="********">
                    </div>

                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="cliente-senha-confirma" required placeholder="Repita a senha">
                        
                        <small id="msg-erro-senha" style="color: red; display: none; margin-top: 5px;">
                            As senhas não coincidem!
                        </small>
                    </div>

                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </form>
            </div>

        </div>
    </main>

    <script src="https://unkpg.com/libphonenumber-js@max/bundle/libphonenumber-max.js"></script>

    <script src="javascript/cadastro.js"></script>
</body>
</html>
